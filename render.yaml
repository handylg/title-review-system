services:
  - type: web
    name: title-review-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SEED_DEMO
        value: "1"
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: title-review-db
          property: connectionString

databases:
  - name: title-review-db
    plan: free
    databaseName: review
    user: review
