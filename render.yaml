services:
  - type: web
    name: title-review-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SEED_DEMO
        value: "1"
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false

# ---------------------------------------------------------------------------
# 可选：使用 Render 免费 PostgreSQL 持久化数据（免费实例有 30 天有效期）。
# 启用步骤：
#   1. 取消下面 databases 段的注释；
#   2. 在上方服务的 envVars 列表中追加：
#        - key: DATABASE_URL
#          fromDatabase:
#            name: title-review-db
#            property: connectionString
# ---------------------------------------------------------------------------
# databases:
#   - name: title-review-db
#     plan: free
#     databaseName: review
#     user: review
